<body>
<div class="w">
<div class="top"><h1>BRÍO<span> ATHLETICS</span></h1><button class="th" id="th" aria-label="Ajustes">⚙️ Ajustes</button></div>
<nav id="nav"></nav>
<main id="v"></main>
</div>
<div id="toast"></div>
<script>
const K='racha-atleta-v1';
const RANKS=[['Novato','🌱',0],['Aspirante','🔰',400],['Bronce','🥉',1200],['Plata','🥈',3000],['Oro','🥇',6000],['Platino','💎',10000],['Diamante','🔷',16000],['Maestro','🎖️',24000],['Élite','⚡',35000],['Campeón','🏆',50000],['Titán','🔥',70000],['Leyenda','👑',100000]];
const MORE=['Hoy no se negocia: se entrena.','Cada repetición es un voto por la persona que quieres ser.','La motivación te arranca; la rutina te lleva lejos.','Nadie recuerda el cansancio, todos recuerdan la marca.','Más fuerte que ayer, más paciente que mañana.','Respira, aprieta los dientes y sigue.','El progreso pequeño sigue siendo progreso.','No esperes ganas: empieza y las ganas llegan.','Tu cuerpo aguanta más de lo que tu cabeza cree.','Un día más, un paso más, un récord más cerca.','El esfuerzo de hoy es la medalla de mañana.','Sudar hoy para sonreír en la meta.','Los límites están para empujarlos.','Entrena como si alguien quisiera quitarte el puesto.','Lo que hoy cuesta, mañana es tu calentamiento.','La constancia le gana al talento cuando el talento descansa.','No busques excusas; busca series.','Cada kilómetro cuenta, incluso el lento.','Descansar también es entrenar; hazlo con cabeza.','Si fuera fácil, no tendría gloria.','Tu ritmo, tu camino, tu récord.','Empieza donde estás, con lo que tienes.','La meta no se acerca sola: acércate tú.','Hoy toca superarte, no compararte.','Un buen entrenamiento no necesita público.','El sudor es la prueba de que lo intentaste.','Ya diste el primer paso: abrir esta app.','Cuando quieras parar, haz una repetición más.','Ganar empieza por levantarse a entrenar.','Confía en el proceso; los resultados llegan solos.','Los campeones repiten lo que los demás se saltan.','Duele un rato; el orgullo dura siempre.','Convierte el «no puedo» en «todavía no».','Tu futuro yo ya está celebrando.','Cada gota de sudor es una moneda en tu hucha.','Hazlo con ganas, hazlo con calma, pero hazlo.','La excelencia es un hábito diario.','Sin prisa, sin pausa, sin excusas.','Hoy es un buen día para romper tu techo.','La victoria se construye en el gimnasio, en la pista y en la cabeza.','Cabeza fría y piernas calientes.','Lo importante no es llegar primero, sino llegar mejor.','No hay atajos hasta la cima, solo buenos pasos.','La magia está en la repetición.','Tu único rival es la pereza de las seis de la mañana.','Una sesión hecha vale más que cien planeadas.','Respeta el proceso y el proceso te respetará.','Que nadie te regale la marca: gánatela.','Siente el latido: está de tu parte.','Termina lo que empezaste y empieza lo que sigue.'].map(t=>[t,'Anónimo']);
const QUOTES=[...MORE,['El dolor es temporal; la marca, para siempre.','Lema de pista'],['No cuentes los días, haz que los días cuenten.','Muhammad Ali'],['Hoy tu yo del futuro te está mirando.','Anónimo'],['La disciplina es hacerlo incluso cuando no apetece.','Anónimo'],['Los campeones se hacen en los días que nadie ve.','Anónimo'],['Un entrenamiento malo es mejor que ninguno.','Anónimo'],['Cae siete veces, levántate ocho.','Proverbio japonés'],['No tienes que ser extremo, solo constante.','Anónimo'],['Tu única competencia es quien fuiste ayer.','Anónimo'],['Lo difícil es empezar. Ya estás aquí.','Anónimo']];
const CHEER=['¡Bestial! Otra sesión al banco 💪','Constancia pura. Así se construye un campeón 🔥','Sumas XP y suma tu futuro ⚡','Hecho. Tu yo de mañana te lo agradece 🙌','Eso es lo que separa a los que quieren de los que lo hacen 🏆'];
const TYPES=['Fuerza','Carrera','Ciclismo','Natación','HIIT','Movilidad','Otro'];
let S={sessions:[],prs:[],goal:4},tab='home',inten=2;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const fmt=s=>{const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const xpOf=x=>Math.round(x.min*[1,1.5,2][x.int-1]);
const totalXP=()=>S.sessions.reduce((a,x)=>a+xpOf(x),0)+S.prs.length*50+(S.claimed||[]).length*100;
const rankIdx=xp=>{let i=0;RANKS.forEach((r,k)=>{if(xp>=r[2])i=k});return i};
function streak(){const set=new Set(S.sessions.map(x=>x.d));let d=new Date();if(!set.has(iso(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n}
function weekCount(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));const st=iso(d);return new Set(S.sessions.filter(x=>x.d>=st).map(x=>x.d)).size}
function achs(){const n=S.sessions.length,m=S.sessions.reduce((a,x)=>a+x.min,0),st=streak(),best=bestStreak(),p=S.prs.length,ri=rankIdx(totalXP());
return[['🚀','Primer paso','Registra tu 1.ª sesión',n>=1],['🔥','En racha','3 días seguidos',best>=3],['🌋','Imparable','7 días seguidos',best>=7],['🗓️','Constante','10 sesiones',n>=10],['🏅','Veterano','50 sesiones',n>=50],['⏱️','1.000 minutos','Suma 1.000 min',m>=1000],['📈','Primera marca','Registra un récord',p>=1],['🎯','Cazarrécords','5 marcas registradas',p>=5],['✅','Semana cumplida','Alcanza tu objetivo semanal',weekCount()>=S.goal],['🥈','Rango Plata','Llega a Plata',ri>=3],['🥇','Rango Oro','Llega a Oro',ri>=4],['🔷','Rango Diamante','Llega a Diamante',ri>=6],['🔥','Rango Titán','Llega a Titán',ri>=10],['👑','Leyenda','Alcanza el rango máximo',ri>=11]].map(a=>({i:a[0],t:a[1],d:a[2],ok:a[3]}))}
function bestStreak(){const ds=[...new Set(S.sessions.map(x=>x.d))].sort();let b=0,c=0,prev=null;ds.forEach(s=>{const d=new Date(s+'T00:00:00');if(prev&&Math.round((d-prev)/864e5)===1)c++;else c=1;b=Math.max(b,c);prev=d});return b}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('s'),3200)}
function after(fn){const r0=rankIdx(totalXP()),a0=achs().filter(a=>a.ok).length;fn();const nc=claim();save();const r1=rankIdx(totalXP()),a1=achs().filter(a=>a.ok);
if(r1>r0)toast('🎉 ¡SUBES A '+RANKS[r1][0].toUpperCase()+'! '+RANKS[r1][1]);else if(nc)toast('🎯 ¡Reto completado! +'+nc*100+' XP');else if(a1.length>a0)toast('🏆 Logro desbloqueado: '+a1[a1.length-1].t);else toast(CHEER[Math.floor(Math.random()*CHEER.length)]);render()}
function home(){const xp=totalXP(),i=rankIdx(xp),r=RANKS[i],nx=RANKS[i+1],pct=nx?Math.min(100,(xp-r[2])/(nx[2]-r[2])*100):100,st=streak(),wc=weekCount(),g=S.goal,q=QUOTES[Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5)%QUOTES.length],C=326.7,off=C*(1-Math.min(1,wc/g));
const mins=S.sessions.reduce((a,x)=>a+x.min,0);
return`<div class="grid"><div class="card hero full"><small>TU RANGO</small><div class="rk">${r[1]} ${r[0]}</div><div class="bar"><i style="width:${pct}%"></i></div><small>${nx?xp+' / '+nx[2]+' XP · faltan '+(nx[2]-xp)+' para '+nx[0]:xp+' XP · rango máximo alcanzado'}</small></div>
<div class="card"><div class="stats"><div><b>${st}🔥</b><span>días de racha</span></div><div><b>${S.sessions.length}</b><span>sesiones</span></div><div><b>${Math.round(mins/60*10)/10}h</b><span>entrenadas</span></div></div></div>
<div class="card ring"><svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--ln)" stroke-width="12"/><circle cx="60" cy="60" r="52" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/><text x="60" y="67" text-anchor="middle" font-size="24" font-weight="800" fill="var(--tx)">${wc}/${g}</text></svg><div><h2>Objetivo semanal</h2><b>${wc>=g?'¡Objetivo cumplido! 🎉':'Te faltan '+(g-wc)+' día'+(g-wc>1?'s':'')}</b><div class="row" style="margin-top:8px;align-items:center"><button class="th" onclick="goal(-1)">−</button><span style="text-align:center">${g} días</span><button class="th" onclick="goal(1)">+</button></div></div></div>
<div class="card full"><h2>Retos de la semana</h2>${chalList()}</div><div class="card full quote">«${q[0]}»<small>— ${q[1]}</small></div>
<div class="card full"><h2>Últimas sesiones</h2>${S.sessions.length?S.sessions.slice().sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5).map(x=>`<div class="li"><div><b>${esc(x.type)}</b> · ${x.min} min<small>${fmt(x.d)} · ${['Suave','Medio','Duro'][x.int-1]}</small></div><b style="color:var(--ac)">+${xpOf(x)} XP</b></div>`).join(''):'<div class="empty">Aún no hay sesiones. ¡Registra la primera y empieza tu racha!</div>'}</div></div>`}
function log(){return`<div class="card"><h2>Registrar entrenamiento</h2>
<label>Tipo</label><select id="ty">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select>
<div class="row"><div><label>Minutos</label><input id="mi" type="number" inputmode="numeric" min="1" max="600" value="45"></div><div><label>Fecha</label><input id="dt" type="date" value="${today()}"></div></div>
<label>Intensidad</label><div class="seg" id="sg">${['Suave','Medio','Duro'].map((n,k)=>`<button data-i="${k+1}" class="${inten===k+1?'on':''}">${n}</button>`).join('')}</div>
<button class="btn" id="go">¡Sumar XP! 🔥</button></div>
<div class="card"><h2>Historial</h2>${S.sessions.length?S.sessions.map((x,k)=>[x,k]).sort((a,b)=>b[0].d.localeCompare(a[0].d)).slice(0,30).map(([x,k])=>`<div class="li"><div><b>${esc(x.type)}</b> · ${x.min} min<small>${fmt(x.d)} · +${xpOf(x)} XP</small></div><button class="x" onclick="delS(${k})" aria-label="Borrar">✕</button></div>`).join(''):'<div class="empty">Sin sesiones todavía.</div>'}</div>`}
function prs(){const g={};S.prs.forEach(p=>{(g[p.name.toLowerCase()]=g[p.name.toLowerCase()]||[]).push(p)});
return`<div class="card"><h2>Nueva marca personal</h2><label>Prueba o ejercicio</label><input id="pn" placeholder="Ej.: Sentadilla, 5K, 100 m…" maxlength="40">
<div class="row"><div><label>Resultado</label><input id="pv" placeholder="Ej.: 120 o 21:30"></div><div><label>Unidad</label><input id="pu" placeholder="kg, min, s…" maxlength="10"></div></div>
<button class="btn" id="gp">Guardar récord 📈 (+50 XP)</button></div>
<div class="card"><h2>Mis récords</h2>${Object.keys(g).length?Object.values(g).map(a=>{const l=a[a.length-1];return`<div class="li"><div><b>${esc(l.name)}</b><small>${fmt(l.d)} · ${a.length} registro${a.length>1?'s':''}${a.length>1?' · antes: '+esc(a[a.length-2].val+' '+a[a.length-2].unit):''}</small></div><div class="pr">${esc(l.val)} <small style="font-size:13px;color:var(--mut)">${esc(l.unit)}</small></div></div>`}).join(''):'<div class="empty">Registra tu primera marca y supérala la próxima vez.</div>'}</div>`}
function ach(){const a=achs(),n=a.filter(x=>x.ok).length;return`<div class="card"><h2>Logros · ${n}/${a.length}</h2><div class="bar" style="background:var(--ln)"><i style="width:${n/a.length*100}%;background:var(--ac)"></i></div></div>
<div class="card"><div class="badges">${a.map(x=>`<div class="bd ${x.ok?'ok':''}"><i>${x.i}</i><b>${x.t}</b><small>${x.d}</small></div>`).join('')}</div></div>
<div class="card"><h2>Rangos</h2>${RANKS.map((r,k)=>`<div class="li"><span>${r[1]} <b>${r[0]}</b></span><span style="color:var(--mut)">${r[2].toLocaleString('es-ES')} XP ${k===rankIdx(totalXP())?'· 📍 tú':''}</span></div>`).join('')}</div>`}
function ws(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function wk(i){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)-7*i);return d}
const POOL=[['⏱️','Suma 150 minutos',150,s=>s.reduce((a,x)=>a+x.min,0)],['📅','Entrena 4 días distintos',4,s=>new Set(s.map(x=>x.d)).size],['💥','2 sesiones de intensidad Dura',2,s=>s.filter(x=>x.int===3).length],['🎲','Prueba 3 tipos de deporte',3,s=>new Set(s.map(x=>x.type)).size],['⚡','Gana 300 XP en la semana',300,s=>s.reduce((a,x)=>a+xpOf(x),0)],['🏔️','Una sesión de 60+ minutos',1,s=>s.filter(x=>x.min>=60).length],['🌅','Entrena en fin de semana',1,s=>s.filter(x=>{const g=new Date(x.d+'T00:00:00').getDay();return g===0||g===6}).length],['📈','Bate una marca personal',1,()=>S.prs.filter(p=>p.d>=ws()).length]];
function chals(){const w=ws(),n=Math.floor(Date.parse(w+'T00:00:00Z')/6048e5),s=S.sessions.filter(x=>x.d>=w);return[0,1,2].map(k=>{const j=(n*3+k)%POOL.length,p=POOL[j],v=Math.min(p[2],p[3](s));return{id:w+'-'+j,i:p[0],t:p[1],g:p[2],v,ok:v>=p[2]}})}
function claim(){S.claimed=S.claimed||[];let c=0;chals().forEach(x=>{if(x.ok&&!S.claimed.includes(x.id)){S.claimed.push(x.id);c++}});return c}
function chalList(){return chals().map(x=>`<div class="chal ${x.ok?'done':''}"><div class="ic">${x.i}</div><div class="b"><b>${x.t}</b><div class="pb"><i style="width:${x.v/x.g*100}%"></i></div></div>${x.ok?'<span class="tag">✓ +100 XP</span>':'<small style="color:var(--mut)">'+x.v+'/'+x.g+'</small>'}</div>`).join('')}
function ret(){const n=chals().filter(x=>x.ok).length;return`<div class="card"><h2>Retos de la semana · ${n}/3</h2><p style="margin:0 0 6px;color:var(--mut);font-size:14px">Cada reto da +100 XP y se renueva cada lunes.</p>${chalList()}</div>`}
function bars(){const W=[];for(let i=7;i>=0;i--){const a=iso(wk(i)),e=wk(i);e.setDate(e.getDate()+6);const b=iso(e);W.push([a,S.sessions.filter(x=>x.d>=a&&x.d<=b).reduce((s,x)=>s+x.min,0)])}const mx=Math.max(60,...W.map(w=>w[1]));return'<svg class="ch" viewBox="0 0 320 145" role="img" aria-label="Minutos por semana">'+W.map((w,i)=>{const h=w[1]/mx*100,x=i*40+6;return`<rect x="${x}" y="${115-h}" width="28" height="${Math.max(h,3)}" rx="6" fill="${i===7?'var(--ac)':'var(--mut)'}" fill-opacity="${i===7?1:.35}"/><text x="${x+14}" y="${109-h}" text-anchor="middle">${w[1]||''}</text><text x="${x+14}" y="134" text-anchor="middle">${+w[0].slice(8)}/${+w[0].slice(5,7)}</text>`}).join('')+'</svg>'}
function heat(){const m={};S.sessions.forEach(x=>m[x.d]=(m[x.d]||0)+x.min);const s0=wk(11),now=new Date();let o='';for(let c=0;c<12;c++)for(let r=0;r<7;r++){const d=new Date(s0);d.setDate(d.getDate()+c*7+r);const k=iso(d),v=m[k]||0,f=d>now?0:v?v<30?.35:v<60?.6:v<90?.8:1:0;o+=`<rect x="${c*24}" y="${r*24}" width="20" height="20" rx="5" fill="${f?'var(--ac)':'var(--mut)'}" fill-opacity="${f||.12}"><title>${fmt(k)}: ${v} min</title></rect>`}return`<svg class="ch hm" viewBox="0 0 284 164" role="img" aria-label="Constancia de las últimas 12 semanas">${o}</svg>`}
function dist(){const m={};S.sessions.forEach(x=>m[x.type]=(m[x.type]||0)+x.min);const a=Object.entries(m).sort((p,q)=>q[1]-p[1]);return a.length?a.map(([t,v])=>`<div class="dist"><span>${esc(t)}</span><div><i style="width:${v/a[0][1]*100}%"></i></div><b>${v} min</b></div>`).join(''):'<div class="empty">Sin datos todavía.</div>'}
function prog(){const w=ws(),lw=iso(wk(1)),mw=S.sessions.filter(x=>x.d>=w).reduce((a,x)=>a+x.min,0),ml=S.sessions.filter(x=>x.d>=lw&&x.d<w).reduce((a,x)=>a+x.min,0),dl=ml?Math.round((mw-ml)/ml*100):null;return`<div class="grid"><div class="card"><h2>Esta semana</h2><div class="stats"><div><b>${mw}</b><span>minutos</span></div><div><b class="delta ${dl!==null&&dl<0?'dn':'up'}">${dl===null?'—':(dl>0?'+':'')+dl+'%'}</b><span>vs semana pasada</span></div><div><b>${bestStreak()}</b><span>mejor racha</span></div></div></div><div class="card"><h2>Minutos por deporte</h2>${dist()}</div><div class="card"><h2>Minutos por semana</h2>${bars()}</div><div class="card"><h2>Constancia · 12 semanas</h2>${heat()}</div></div>`}
function dots(){const w=new Date(ws()+'T00:00:00'),set=new Set(S.sessions.map(x=>x.d)),t=today();return'<div class="dots">'+'LMXJVSD'.split('').map((l,i)=>{const d=new Date(w);d.setDate(w.getDate()+i);const k=iso(d),on=set.has(k);return`<div class="dot ${on?'on':''} ${k===t?'now':''}"><i>${on?'✓':''}</i><span>${l}</span></div>`}).join('')+'</div>'}
function home2(){const xp=totalXP(),i=rankIdx(xp),r=RANKS[i],nx=RANKS[i+1],pct=nx?Math.min(100,(xp-r[2])/(nx[2]-r[2])*100):100,st=streak(),wc=weekCount(),g=S.goal,q=QUOTES[Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5)%QUOTES.length],h=new Date().getHours(),hi=h<7?'Buenas noches':h<14?'Buenos días':h<21?'Buenas tardes':'Buenas noches',dt=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}),mins=S.sessions.reduce((a,x)=>a+x.min,0);
return`<div class="grid"><div class="card full hi"><span class="hand">${dt}</span><h3>${hi}, ${S.name?esc(S.name):'atleta'}</h3><p>${wc>=g?'Objetivo semanal cumplido. Hoy toca disfrutar.':'Llevas '+wc+' de '+g+' días esta semana.'}</p></div>
<div class="card seal"><div class="sello"><b>${r[1]}</b></div><div><span class="hand">tu rango</span><div class="rk2">${r[0]}</div><div class="thin"><i style="width:${pct}%"></i></div><small>${nx?xp.toLocaleString('es-ES')+' / '+nx[2].toLocaleString('es-ES')+' XP · siguiente: '+nx[0]:'Rango máximo alcanzado'}</small></div></div>
<div class="note"><p>«${q[0]}»</p><span class="hand">— ${q[1]}</span></div>
<div class="card"><h2>Mi semana</h2>${dots()}<div class="chips"><span>🔥 ${st} de racha</span><span>🗒️ ${S.sessions.length} sesiones</span><span>⏳ ${Math.round(mins/60*10)/10} h</span></div><div class="gl"><button class="th" onclick="goal(-1)">−</button><span>objetivo: ${g} días</span><button class="th" onclick="goal(1)">+</button></div></div>
<div class="card"><h2>Retos de la semana</h2>${chalList()}</div>
<div class="card full"><h2>Últimas sesiones</h2>${S.sessions.length?S.sessions.slice().sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5).map(x=>`<div class="li"><div><b>${esc(x.type)}</b> · ${x.min} min<small>${fmt(x.d)} · ${['Suave','Medio','Duro'][x.int-1]}</small></div><b style="color:var(--ac)">+${xpOf(x)} XP</b></div>`).join(''):'<div class="empty">Tu diario está en blanco. ¿Escribimos la primera página?</div>'}</div></div>`}
function saveName(){S.name=$('#nm').value.trim().slice(0,24);save();toast(S.name?'¡Hola, '+S.name+'!':'Nombre borrado')}
function cfg(){return`<div class="card"><h2>Tu nombre</h2><label for="nm">Así te saludaré en la pantalla de inicio</label><input id="nm" maxlength="24" placeholder="Ej.: Alex" value="${esc(S.name||'')}" autocomplete="given-name" onkeydown="if(event.key==='Enter')saveName()"><button class="btn" onclick="saveName()">Guardar nombre</button></div>
<div class="card"><h2>Tema</h2><div class="skins">${skinGrid()}</div></div>
<div class="card"><h2>Objetivo semanal</h2><label>Días de entrenamiento por semana</label><div class="gl" style="margin-top:6px"><button class="th" onclick="goal(-1)">−</button><b style="font-size:20px;color:var(--tx)">${S.goal} días</b><button class="th" onclick="goal(1)">+</button></div></div>`}
function render(){const T=[['home','🏠','Inicio'],['log','➕','Entrenar'],['prog','📊','Progreso'],['ret','🎯','Retos'],['prs','📈','Marcas'],['ach','🏆','Logros']];
$('#nav').innerHTML=T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)"><span>${t[1]}</span>${t[2]}</button>`).join('');
$('#v').className=tab==='log'||tab==='prs'?'two':'';$('#v').innerHTML={home:home2,log,prog,ret,prs,ach,cfg}[tab]();
if(tab==='log'){$('#sg').onclick=e=>{const b=e.target.closest('button');if(!b)return;inten=+b.dataset.i;[...$('#sg').children].forEach(c=>c.classList.toggle('on',c===b))};
$('#go').onclick=()=>{const m=Math.max(1,Math.min(600,parseInt($('#mi').value)||0)),d=$('#dt').value||today();if(!m){toast('Pon los minutos');return}after(()=>S.sessions.push({d,type:$('#ty').value,min:m,int:inten}))}}
if(tab==='prs')$('#gp').onclick=()=>{const n=$('#pn').value.trim(),v=$('#pv').value.trim();if(!n||!v){toast('Rellena prueba y resultado');return}after(()=>S.prs.push({name:n,val:v,unit:$('#pu').value.trim(),d:today()}))}}
function delS(k){S.sessions.splice(k,1);save();render()}
function goal(n){S.goal=Math.max(1,Math.min(7,S.goal+n));save();render()}
const SKINS=[['pro','⚡','Pro','Negro y lima'],['fuego','🔥','Fuego','Rojo intenso'],['pista','🏁','Pista','Blanco y naranja'],['oceano','🌊','Océano','Azul profundo'],['bosque','🌲','Bosque','Verde trail'],['neon','🔮','Neón','Violeta y rosa'],['oro','🥇','Oro','Negro y dorado'],['hielo','🧊','Hielo','Azul claro'],['atardecer','🌅','Atardecer','Naranja y magenta'],['mono','⬛','Mono','Blanco y negro']];
const SW={pro:['#c6ff1a','#0b0d10'],fuego:['#ff3d2e','#0f0a0a'],pista:['#ff4d00','#eef0f3'],oceano:['#2d9cff','#07121f'],bosque:['#38d27a','#0c120e'],neon:['#b44dff','#0e0a1a'],oro:['#f5b800','#0d0c09'],hielo:['#0a84ff','#eaf4fb'],atardecer:['#ff7a45','#1a0f1f'],mono:['#111111','#f4f4f4']};
function skin(id){const r=document.documentElement;r.dataset.skin=id;r.dataset.kind='sport';S.skin=id;save();if(tab==='cfg')render()}
function skinGrid(){const id=S.skin;return SKINS.map(s=>`<button class="${s[0]===id?'on':''}" onclick="skin('${s[0]}')"><span>${s[1]}</span><b>${s[2]}</b><small>${s[3]}</small><i class="sw" style="background:linear-gradient(90deg,${SW[s[0]][0]} 50%,${SW[s[0]][1]} 50%)"></i></button>`).join('')}
$('#th').onclick=()=>{tab='cfg';render();scrollTo(0,0)};
skin(SKINS.some(s=>s[0]===S.skin)?S.skin:'pro');
render();
</script>
</body>
</html>
